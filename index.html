<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odliczanie do Urodzinowego Live - Flip Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: transparent !important;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
  }

  .container {
    text-align: center;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 10px;
    color: #ffffff;
    /* Płynne przejście pokazywania i znikania całego zegara (1 sekunda animacji) */
    transition: opacity 1s ease-in-out;
  }

  .title {
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #fe2c55;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 15px rgba(254, 44, 85, 0.8);
    margin-bottom: 18px;
    font-weight: 900;
  }

  .timer {
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Karta kalendarza */
  .flip-card {
    position: relative;
    width: 78px;
    height: 86px;
    background-color: #161622;
    border-radius: 10px;
    font-size: 48px;
    font-weight: 900;
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.75);
    perspective: 400px;
  }

  /* Linia zgięcia kartki na środku */
  .flip-card::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(0, 0, 0, 0.85);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12);
    z-index: 10;
    transform: translateY(-50%);
  }

  /* Połówki kartek */
  .top, .bottom, .leaf-front, .leaf-back {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    background-color: #161622;
    display: flex;
    justify-content: center;
  }

  .top, .leaf-front {
    top: 0;
    align-items: flex-end;
    border-radius: 10px 10px 0 0;
    background: linear-gradient(180deg, #222234 0%, #151520 100%);
  }

  .bottom, .leaf-back {
    bottom: 0;
    align-items: flex-start;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(180deg, #12121c 0%, #1c1c2b 100%);
  }

  /* Wyrównanie tekstu na połówkach */
  .top span, .leaf-front span {
    transform: translateY(50%);
    line-height: 0;
  }

  .bottom span, .leaf-back span {
    transform: translateY(-50%);
    line-height: 0;
  }

  /* Animowany liść kalendarza */
  .leaf {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50%;
    transform-origin: bottom;
    transform-style: preserve-3d;
    z-index: 5;
  }

  .leaf-front, .leaf-back {
    height: 100%;
    backface-visibility: hidden;
  }

  .leaf-back {
    transform: rotateX(180deg);
  }

  .flipping .leaf {
    animation: flipDown 0.55s cubic-bezier(0.37, 0.01, 0.94, 0.35) forwards;
  }

  @keyframes flipDown {
    0% {
      transform: rotateX(0deg);
    }
    100% {
      transform: rotateX(-180deg);
    }
  }

  .label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: #ffffff;
    margin-top: 10px;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
  }

  .live-now {
    font-size: 34px;
    font-weight: 900;
    color: #00f2fe;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 242, 254, 0.9);
  }
</style>
</head>
<body>

<div class="container" id="box">
  <div class="title" id="header-text">DO URODZINOWEGO LIVE ZOSTAŁO:</div>
  <div class="timer" id="countdown">
    
    <div class="unit">
      <div class="flip-card" id="days">
        <div class="top"><span>00</span></div>
        <div class="bottom"><span>00</span></div>
      </div>
      <span class="label">Dni</span>
    </div>

    <div class="unit">
      <div class="flip-card" id="hours">
        <div class="top"><span>00</span></div>
        <div class="bottom"><span>00</span></div>
      </div>
      <span class="label">Godz</span>
    </div>

    <div class="unit">
      <div class="flip-card" id="minutes">
        <div class="top"><span>00</span></div>
        <div class="bottom"><span>00</span></div>
      </div>
      <span class="label">Min</span>
    </div>

    <div class="unit">
      <div class="flip-card" id="seconds">
        <div class="top"><span>00</span></div>
        <div class="bottom"><span>00</span></div>
      </div>
      <span class="label">Sek</span>
    </div>

  </div>
</div>

<script>
  // Czas UK (GMT / UTC+0 na grudzień)
  const targetDate = new Date("2026-12-03T12:00:00Z").getTime();

  function updateCard(cardId, newValue) {
    const card = document.getElementById(cardId);
    if (!card) return;

    const topSpan = card.querySelector('.top span');
    const bottomSpan = card.querySelector('.bottom span');
    const currentValue = topSpan.innerText;

    if (currentValue === newValue) return;

    const oldLeaf = card.querySelector('.leaf');
    if (oldLeaf) oldLeaf.remove();

    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.innerHTML = `
      <div class="leaf-front"><span>${currentValue}</span></div>
      <div class="leaf-back"><span>${newValue}</span></div>
    `;

    topSpan.innerText = newValue;
    bottomSpan.innerText = currentValue;

    card.appendChild(leaf);
    void leaf.offsetWidth;
    card.classList.add('flipping');

    setTimeout(() => {
      bottomSpan.innerText = newValue;
      card.classList.remove('flipping');
      leaf.remove();
    }, 550);
  }

  function calculateTime() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      document.getElementById("header-text").style.display = "none";
      document.getElementById("countdown").innerHTML = '<div class="live-now">🎉 URODZINOWY LIVE STARTUJE! 🎉</div>';
      return null;
    }

    return {
      days: String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0'),
      hours: String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0'),
      minutes: String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0'),
      seconds: String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0')
    };
  }

  function updateTimer() {
    const time = calculateTime();
    if (!time) return;

    updateCard("days", time.days);
    updateCard("hours", time.hours);
    updateCard("minutes", time.minutes);
    updateCard("seconds", time.seconds);
  }

  // Logika cyklu ukrywania (5 minut niewidoczny, 1 minuta widoczny)
  function handleVisibilityCycle() {
    const totalCycleSeconds = 6 * 60; // Cały cykl: 5 min ukryty + 1 min widoczny = 360 sekund
    const visibleDuration = 1 * 60;   // Czas widoczności: 60 sekund (1 minuta)

    // Pobieramy aktualny czas w sekundach od północy (dzięki temu zegar działa tak samo po odświeżeniu)
    const now = new Date();
    const secondsInDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const currentCycleTime = secondsInDay % totalCycleSeconds;

    const boxElement = document.getElementById("box");
    if (boxElement) {
      // Jeśli jesteśmy w przedziale 0 do 60 sekund cyklu – zegar jest widoczny (1 minuta)
      // W pozostałym czasie (od 60 do 360 sekundy) – zegar jest schowany (5 minut)
      if (currentCycleTime < visibleDuration) {
        boxElement.style.opacity = "1";
        boxElement.style.pointerEvents = "auto";
      } else {
        boxElement.style.opacity = "0";
        boxElement.style.pointerEvents = "none"; // Blokuje klikanie w niewidoczny element
      }
    }
  }

  const initialTime = calculateTime();
  if (initialTime) {
    for (const [id, val] of Object.entries(initialTime)) {
      const card = document.getElementById(id);
      if (card) {
        card.querySelector('.top span').innerText = val;
        card.querySelector('.bottom span').innerText = val;
      }
    }
  }

  // Uruchomienie funkcji co sekundę
  setInterval(() => {
    updateTimer();
    handleVisibilityCycle();
  }, 1000);

  // Wywołanie od razu przy starcie
  handleVisibilityCycle();
</script>
</body>
</html>
