<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odliczanie do Urodzinowego Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
  body {
    margin: 0; padding: 0; background-color: transparent;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; font-family: 'Montserrat', sans-serif; overflow: hidden;
  }
  .container {
    text-align: center; background: rgba(15, 15, 25, 0.75);
    border: 2px solid #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
    border-radius: 16px; padding: 20px 35px; color: #ffffff;
  }
  .title {
    font-size: 18px; text-transform: uppercase; letter-spacing: 2px;
    color: #fe2c55; text-shadow: 0 0 10px rgba(254, 44, 85, 0.8);
    margin-bottom: 12px; font-weight: 900;
  }
  .timer { display: flex; gap: 15px; justify-content: center; }
  .box { display: flex; flex-direction: column; align-items: center; min-width: 65px; }
  .number { font-size: 42px; font-weight: 900; line-height: 1; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
  .label { font-size: 11px; text-transform: uppercase; color: #cccccc; margin-top: 5px; letter-spacing: 1px; }
  .live-now { font-size: 32px; font-weight: 900; color: #00f2fe; text-shadow: 0 0 15px rgba(0, 242, 254, 0.9); }
</style>
</head>
<body>
<div class="container" id="box">
  <div class="title" id="header-text">DO URODZINOWEGO LIVE ZOSTAŁO:</div>
  <div class="timer" id="countdown">
    <div class="box"><span class="number" id="days">00</span><span class="label">Dni</span></div>
    <div class="box"><span class="number" id="hours">00</span><span class="label">Godz</span></div>
    <div class="box"><span class="number" id="minutes">00</span><span class="label">Min</span></div>
    <div class="box"><span class="number" id="seconds">00</span><span class="label">Sek</span></div>
  </div>
</div>
<script>
  const targetDate = new Date("2026-12-03T12:00:00Z").getTime();
  function updateTimer() {
    const now = new Date().getTime();
    const distance = targetDate - now;
    if (distance <= 0) {
      document.getElementById("header-text").style.display = "none";
      document.getElementById("countdown").innerHTML = '<div class="live-now">🎉 URODZINOWY LIVE STARTUJE! 🎉</div>';
      return;
    }
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
    document.getElementById("days").innerText = String(days).padStart(2, '0');
    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
  }
  setInterval(updateTimer, 1000);
  updateTimer();
</script>
</body>
</html>
